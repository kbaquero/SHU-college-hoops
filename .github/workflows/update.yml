name: Update standings

# Runs on code/data pushes and the manual button. Day-to-day updates come from watch.yml.

on:
  workflow_dispatch:         # "Run workflow" button for manual updates
    inputs:
      mode:
        description: "full = rescore everything; scores = only refresh Today's games"
        type: choice
        options: [full, scores]
        default: full
  push:
    paths: ["data/**", "tracker/**", "tests/**", ".github/**"]   # re-score when entries, seeds or code change

permissions:
  contents: write

concurrency:
  group: standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Update
        env:
          EVENING: ${{ inputs.mode == 'scores' }}
        run: |
          if [ "$EVENING" = "true" ]; then
            python -m tracker.run --scores     # Today's games only; standings stay at the morning numbers
          else
            python -m tracker.run              # full rescore
          fi
      - name: Commit results
        run: |
          git config user.name "standings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/teams.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            if [ "${{ inputs.mode == 'scores' }}" = "true" ]; then
              git commit -m "Update scores $(date -u +'%F %H:%M') UTC"
            else
              git commit -m "Update standings $(date -u +%F)"
            fi
            git push || (git pull -q --rebase -X theirs && git push)   # the watcher may have pushed meanwhile
          fi
