name: Watch games

# One long job keeps the site current: morning full update, scores every 10 minutes while games are on, sleeping
# in between. Before GitHub's 6-hour limit it starts its own successor, so the schedule below is only a fallback
# to restart the chain if it ever breaks (GitHub often skips scheduled runs; any one that fires is enough).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # push updated pages
  actions: write    # start the next watcher

concurrency:
  group: watcher      # only one watcher runs; a fallback that fires while one is running waits, then exits quickly
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "standings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m tracker.watch --minutes 345
